name: Release
on:
  push:
    tags: ["v*"]
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The build, attestations and release run in the org's reusable workflow, so the provenance is signed by that file
  # and nothing in this repository's workflow can touch the build (SLSA v1 Build Level 3).
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: Totative/.github/.github/workflows/release-source.yml@8c28dcd2a8602fcb688d7a344005d970b8ab064f # main
